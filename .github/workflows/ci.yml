name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native deps (Avalonia headless on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libfreetype6

      - name: Restore
        run: dotnet restore PuraMarkdown.slnx

      - name: Build
        run: dotnet build PuraMarkdown.slnx -c Release --no-restore

      - name: Test (headless Avalonia)
        run: dotnet test tests/PuraMarkdown.Tests/PuraMarkdown.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack PuraMarkdown.slnx -c Release --no-build -o artifacts/nuget

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg
